name: Construire Foyer+

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
  VITE_WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
  VITE_GH_REPO: ${{ github.repository }}
  VITE_APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Installer
        run: npm ci
      - name: Construire l'application web
        run: npm run build
      - name: Copier dans le projet Android
        run: npx cap sync android
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/foyer.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/foyer.jks" >> "$GITHUB_ENV"
          fi
      - name: Compiler l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../Foyer-plus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Foyer-plus-apk
          path: Foyer-plus.apk
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Foyer+ 1.0.${{ github.run_number }}
          body: "Téléchargez **Foyer-plus.apk** ci-dessous et ouvrez-le sur votre téléphone Android."
          files: Foyer-plus.apk
          make_latest: true

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
